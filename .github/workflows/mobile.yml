name: Mobile device test

on:
  push:
  pull_request:
  workflow_dispatch:

# Only one mobile test run per branch/PR. New commits cancel stale emulator runs.
concurrency:
  group: mobile-device-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-emulation:
    name: Mobile browser emulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test

  android-adb:
    name: Android emulator and ADB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: android-actions/setup-android@v3
      - name: Install Android emulator components
        run: |
          sdkmanager --install \
            'platform-tools' \
            'emulator' \
            'platforms;android-30' \
            'system-images;android-30;google_apis;x86_64'
          yes | sdkmanager --licenses >/dev/null || true
      - name: Create and boot emulator without KVM
        run: |
          set -euxo pipefail
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd \
            --name mobile-test \
            --package 'system-images;android-30;google_apis;x86_64' \
            --device pixel_2
          emulator -list-avds
          nohup "$ANDROID_HOME/emulator/emulator" @mobile-test \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -no-accel > emulator.log 2>&1 &
          if ! timeout 180 adb wait-for-device; then
            echo 'Emulator did not connect to ADB within 180 seconds.'
            adb devices -l || true
            cat emulator.log || true
            exit 1
          fi
          timeout 600 bash -c \
            'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\\r")" = "1" ]; do sleep 5; done'
      - name: Run ADB smoke test
        run: |
          set -e
          adb devices
          adb shell getprop ro.build.version.release
          adb shell wm size
          adb shell input keyevent 82
          adb shell settings get secure android_id
      - name: Upload emulator log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-log
          path: emulator.log
